display_information:
  name: Inventory Bot
  description: Reserve inventory from a DM or an @mention
  background_color: "#2C2D30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Inventory Bot
    always_online: true
  shortcuts:
    - name: Reserve an item
      type: global
      callback_id: open_reservation_modal
      description: Choose an inventory item and reservation end time
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
